introEn: |-
  Welcome to the Cognitive Language and Information Lab (CLAIN)! 👋

  The Cognitive Language and Information Lab is an innovative Artificial Intelligence (AI) research center at the School of Artificial Intelligence, Wuhan University. Under the visionary leadership of Professor Min Peng and Professor Qianqian Xie, we are dedicated to pioneering AI through cutting-edge interdisciplinary research and collaboration.

  🌍 About Us
  Our center provides a dynamic and collaborative research environment, blending theoretical AI breakthroughs with real-world technological innovations.

  🚀 How to Get Involved
  We invite students, researchers, and AI enthusiasts to actively participate in various capacities:
  🤝 Research Collaborations – Join our ongoing projects or propose new research ideas.
  💬 Discussion Forums Exchange insights, engage in discussions on AI advancements, and collaborate with experts.
  📢 Workshops & Seminars Attend events featuring prominent AI researchers and thought leaders.

  📩 Contact Us
  Become a part of our expanding community of AI pioneers! Reach out to explore collaboration opportunities and contribute to groundbreaking AI research.

  🔗 Let's push the boundaries of AI together at CLAIN! 🚀
introZh: |-
  欢迎来到认知语言与信息实验室 (CLAIN)! 👋
  认知语言与信息实验室是武汉大学人工智能学院的一个创新人工智能 (AI) 研究中心。在彭敏教授和谢倩倩教授的远见领导下，我们致力于通过前沿跨学科研究和合作，开创人工智能的新篇章。

  🌍 关于我们
  我们的中心提供动态且协作的研究环境，将理论AI突破与现实世界的技术创新相结合。
  🚀 如何参与
  我们邀请学生、研究者和AI爱好者以各种方式积极参与：

  🤝 研究合作 – 加入我们正在进行的项目或提出新的研究想法。
  💬 讨论论坛 – 交流见解、参与AI进展讨论，并与专家合作。
  📢 工作坊与研讨会 – 参加由知名AI研究者和思想领袖主讲的活动。

  📩 联系我们
  成为我们不断扩大的AI先驱社区的一员！联系我们探索合作机会，并为突破性AI研究贡献力量。
  🔗 让我们在CLAIN共同推动AI的边界！🚀
hiringTextEn: The Cognitive Language and Information Lab (CLAIN) at Wuhan University welcomes outstanding researchers, postdoctoral fellows, and PhD students in artificial intelligence, natural language processing, and related fields. We are actively recruiting talented individuals to join our team and contribute to cutting-edge research projects. Interested candidates are encouraged to contact Professor Min Peng or the center for collaboration and recruitment opportunities.
hiringTextZh: 武汉大学认知语言与信息实验室 (CLAIN) 诚邀人工智能、自然语言处理及相关领域优秀研究人员、博士后和博士生加入。我们正在积极招募优秀人才参与前沿研究项目。有意者请联系彭敏教授或中心探讨合作与招聘机会。
