name = "finance-portal-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
APP_ORIGIN = "http://localhost:5173"
FEISHU_APP_ID = ""

# 密钥用 wrangler secret put 设置，不写在这里：FEISHU_APP_SECRET、SESSION_SECRET
