name = "finance-portal-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
APP_ORIGIN = "http://localhost:5173"

# 密钥用 wrangler secret put 设置，不写在这里：FEISHU_APP_ID、FEISHU_APP_SECRET、SESSION_SECRET
# Hyperdrive 指向 Supabase Postgres，以 app_api 角色连接
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "74b386399f8e409c84b9b13ab2f9a5ca"
