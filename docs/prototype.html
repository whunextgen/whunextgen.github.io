<style>

main{padding:0 24px 40px;min-width:0}

button{border:1px solid var(--pri);background:var(--pri);color:#fff;border-radius:6px;padding:5px 12px;cursor:pointer}

button.sm{padding:2px 8px;font-size:12px}

.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}

table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--mute);font-weight:500;background:#fafbfc}
td.r,th.r{text-align:right}
tr.sum td{font-weight:600;background:#fafbfc}
tr.grp td{background:var(--pri-bg);font-weight:600}
.scroll{overflow-x:auto}

.steps div:last-child{border-right:0}
.steps div b{display:block;color:var(--ink);font-size:14px}
.steps div.done{background:var(--ok-bg)}.steps div.cur{background:var(--pri-bg);box-shadow:inset 0 -3px 0 var(--pri)}
.periods{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}

.msg{padding:9px 12px;border-radius:8px;margin-bottom:14px;background:var(--pri-bg);color:var(--pri)}
.msg.bad{background:var(--bad-bg);color:var(--bad)}
.form{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.bar{height:8px;background:#eef0f3;border-radius:4px;overflow:hidden;min-width:120px;display:flex}

ul.chk{list-style:none;margin:0;padding:0}

td input[type=number]{width:92px;text-align:right;padding:3px 6px}

td.gap{background:var(--bad-bg);color:var(--bad);font-weight:600}

 'B|耗材':{v:'可',log:[['2026-06-18','财务甲','可','']]},'B|国内差旅':{v:'可',log:[['2026-06-18','财务甲','可','']]},

 'D|专利费':{v:'可',log:[['2026-08-02','科发院','可','']]},'D|API 充值':{v:'可',log:[['2026-08-02','财务乙','可','记业务费']]},
 'E|会员订阅':{v:'可',log:[['2026-07-15','财务甲','可','']]},'E|API 充值':{v:'可',log:[['2026-07-15','财务甲','可','']]},'E|专利费':{v:'可',log:[['2026-07-15','财务甲','可','']]},
 'E|会议注册费':{v:'可',log:[['2026-05-25','财务甲','可','']]},'E|聚餐':{v:'不可',log:[['2026-05-25','财务甲','不可','']]},'E|国内差旅':{v:'可',log:[['2026-05-25','财务甲','可','']]}};
const PATHS={'直采':['下单','审批（约 14 天）','到货','验收贴码'],'集采':['申报','集中采购（约 2.5 个月）','到货','验收贴码'],'分散采购':['备案','论证','挂网竞价','合同','到货','验收贴码']};
let REQ=[
 {id:'R01',c:'A',s:'equip',t:'服务器与 GPU',d:'GPU 服务器',amt:315000,st:'已承诺',eta:'2026-09-28',path:'分散采购',stage:2,log:[['2026-08-24','废标：所有供应商报价为同一品牌，重新挂网']]},

 {id:'R03',c:'A',s:'equip',t:'服务器与 GPU',d:'内存与硬盘',amt:48000,st:'已入账',post:['2026-06-12',48000],path:'直采',stage:4,log:[]},
 {id:'R04',c:'A',s:'net',t:'API 充值',d:'API 充值 8 月',amt:10000,st:'被退回',eta:'2026-09-18',log:[['2026-09-07','退回：该卡不能列支 API']]},
 {id:'R05',c:'A',s:'abroad',t:'国际差旅',d:'国际会议出访',amt:28000,st:'已入账',post:['2026-08-30',28000],log:[]},
 {id:'R06',c:'A',s:'travel',t:'国内差旅',d:'国内会议差旅',amt:12000,st:'学校审核中',eta:'2026-09-12',log:[]},
 {id:'R07',c:'B',s:'net',t:'API 充值',d:'API 充值 7 月',amt:10000,st:'已入账',post:['2026-08-15',10000],log:[]},
 {id:'R08',c:'B',s:'mat',t:'耗材',d:'实验耗材',amt:8000,st:'已入账',post:['2026-06-20',8000],log:[]},
 {id:'R09',c:'C',s:'net',t:'API 充值',d:'API 集中充值 三季度',amt:30000,st:'已入账',post:['2026-07-20',30000],log:[]},
 {id:'R10',c:'C',s:'equip',t:'电脑',d:'笔记本 4 台',amt:28000,st:'已承诺',eta:'2026-11-15',path:'集采',stage:1,log:[]},
 {id:'R11',c:'E',s:'biz',t:'会员订阅',d:'文献工具年费',amt:3200,st:'待审批',eta:'2026-09-25',log:[]},
 {id:'R12',c:'E',s:'travel',t:'会议注册费',d:'会议注册费',amt:6000,st:'已入账',post:['2026-05-30',6000],log:[]},
 {id:'R13',c:'D',s:'biz',t:'专利费',d:'专利申请费',amt:4500,st:'学校审核中',eta:'2026-09-10',log:[]}];
let ADJ=[{id:'J01',c:'A',from:'conf',to:'equip',amt:50000,why:'会议改线上，设备需求增加',st:'已批复',date:'2026-07-20'}];
const PEOPLE=[{id:'P1',n:'校外 RA-01',k:'外聘人员劳务费',s:'labor',m:3500},{id:'P2',n:'校外 RA-02',k:'外聘人员劳务费',s:'labor',m:3500},{id:'P3',n:'校外 RA-03',k:'外聘人员劳务费',s:'labor',m:4000},
 {id:'P4',n:'学生-01',k:'学生三兼费',s:'labor',m:2500},{id:'P5',n:'学生-02',k:'学生三兼费',s:'labor',m:3000},{id:'P6',n:'科研助理-01',k:'编外人员工资',s:'wage',m:6500}];

const ASG={};PEOPLE.forEach(p=>{ASG[p.id]={};MONTHS.forEach(m=>ASG[p.id][m]={c:(p.id==='P4'||p.id==='P5')?'C':'A',amt:p.m})});

const sum=a=>a.reduce((x,y)=>x+y,0);

function bud(c,s){return (BUD0[c][s]||0)+adjOf(c,s)}
function total(c){return sum(tpl(c).subs.map(s=>bud(c,s)))}

// 流水：每张卡的每一笔钱，带日期和状态。决算数只来自学校已入账。
function flows(c){const out=[];
 REQ.filter(r=>r.c===c).forEach(r=>{if(r.st==='已入账')out.push({s:r.s,amt:r.post[1],date:r.post[0],k:r.post[0]<=S.today?'actual':'commit'});else if(OPEN.includes(r.st))out.push({s:r.s,amt:r.amt,date:r.eta,k:'commit'})});

 return out}
function gapWhy(c,d){const k=card(c);if(d<k.start)return '未下达';if(d>k.cutoff)return k.end==='recall'?'已回收':'已结题';return ''}
function cell(c,s){const f=flows(c).filter(x=>x.s===s);const b=bud(c,s),a=sum(f.filter(x=>x.k==='actual').map(x=>x.amt)),m=sum(f.filter(x=>x.k==='commit').map(x=>x.amt));return{orig:BUD0[c][s]||0,adj:adjOf(c,s),cur:b,commit:m,actual:a,avail:b-m-a}}
function agg(c){const t={orig:0,adj:0,cur:0,commit:0,actual:0,avail:0};tpl(c).subs.forEach(s=>{const x=cell(c,s);for(const k in t)t[k]+=x[k]});return t}
function upTo(c,d){return sum(flows(c).filter(x=>x.date<=d).map(x=>x.amt))}
function nodeState(c,n){const T=total(c),need=T*n[1],v=upTo(c,n[0]);const past=n[0]<S.today;return{need,v,gap:Math.max(0,need-v),past,ok:v>=need}}
function gaps(){const g=[];PEOPLE.forEach(p=>MONTHS.forEach(m=>{const a=ASG[p.id][m];if(a.amt&&gapWhy(a.c,payDate(m)))g.push({p,m,why:gapWhy(a.c,payDate(m))})}));return g}

function lateWhy(r){const k=card(r.c);if(r.eta>k.cutoff)return '预计入账晚于单据截止 '+md(k.cutoff);const n=k.nodes.find(n=>n[2]==='回收'&&n[0]>=S.today);if(n&&r.eta>n[0]&&!nodeState(r.c,n).ok)return '预计入账晚于回收节点 '+md(n[0]);return ''}

 CARDS.forEach((c,i)=>{const a=A[i];const ns=c.nodes.map(n=>{const s=nodeState(c.id,n);const lab=md(n[0])+' '+Math.round(n[1]*100)+'% '+n[2];return s.past?B(lab+(s.ok?' 已达':' 未达 差 '+fmt(s.gap)),s.ok?'ok':'bad'):B(lab+(s.ok?' 预计达标':' 预计差 '+fmt(s.gap)),s.ok?'ok':'warn')}).join(' ')||'<span class="note">无中间节点</span>';

 h+='<tr class="sum"><td>合计</td><td class="r">'+fmt(T('cur'))+'</td><td class="r">'+fmt(T('actual'))+'</td><td class="r">'+fmt(T('commit'))+'</td><td class="r">'+fmt(T('avail'))+'</td><td colspan="3"></td></tr></table></div></div>';
 const todo=[[pend.length,'笔支出待负责人审批','req'],[rej.length,'笔单据被学校退回','school'],[lt.length,'笔承诺预计赶不上节点','proc'],[g.length,'个人月的人员费挂在已回收或未下达的卡上','staff'],[adjp.length,'笔预算变更在途','cards'],[ev.length,'笔到账认领或借票核销未办','school']];
 h+='<div class="card"><h3>待办</h3><ul class="chk">'+todo.map(t=>'<li>'+B(t[0],t[0]?'bad':'ok')+' '+t[1]+' <a href="#" onclick="go(\''+t[2]+'\');return false">去处理</a></li>').join('')+'</ul></div>';
 if(lt.length)h+='<div class="card"><h3>来不及的承诺</h3><table><tr><th>单号</th><th>经费卡</th><th>事项</th><th class="r">金额</th><th>预计入账</th><th>问题</th></tr>'+lt.map(r=>'<tr><td>'+r.id+'</td><td>'+card(r.c).no+'</td><td>'+esc(r.d)+'</td><td class="r">'+fmt(r.amt)+'</td><td>'+r.eta+'</td><td>'+B(lateWhy(r),'bad')+'</td></tr>').join('')+'</table></div>';

 let h='<div class="card"><div class="form">'+cardSel('cs',"S.card=this.value;S.msg=null;render()")+B(t.n,'pri')+(t.locked?B('科目不可增改','bad'):'')+(SETTLED[c.id]?B('已结清','ok'):'')+'<span class="note">起 '+c.start+'　单据截止 '+c.cutoff+'　'+c.rule+'</span></div></div>';

 h+='<tr class="sum"><td>合计</td><td class="r">'+fmt(a.orig)+'</td><td class="r">'+(a.adj?fmt(a.adj):'')+'</td><td class="r">'+fmt(a.cur)+'</td><td class="r">'+fmt(a.commit)+'</td><td class="r">'+fmt(a.actual)+'</td><td class="r">'+fmt(a.avail)+'</td><td>'+pct(a.actual,a.cur)+'</td></tr></table></div>';

rules(){let h='<div class="card"><h3>经费卡 × 支出类型</h3><p class="hint">每一格是财务或职能部门的答复。未确认的类型不能提交支出；有争议的可以提交但会标出退单风险。学校退单的原因自动记到对应格子。</p><div class="scroll"><table class="mx"><tr><th class="l">支出类型</th>'+CARDS.map(c=>'<th>'+c.no+'<br>'+c.n+'</th>').join('')+'</tr>';

  else if(x.st==='已承诺')act=(x.path&&x.stage<PATHS[x.path].length?'<span class="note">采购未验收</span> ':'<button class="sm"'+dis(fin())+' onclick="xSet(\''+x.id+'\',\'学校审核中\')">提交学校</button> ')+'<button class="sm ghost"'+dis(fin())+' onclick="xSet(\''+x.id+'\',\'已释放\')">释放</button>';
  else if(x.st==='学校审核中')act='<button class="sm"'+dis(fin())+' onclick="xPost(\''+x.id+'\')">录入入账</button> <button class="sm ghost"'+dis(fin())+' onclick="xBack(\''+x.id+'\')">学校退回</button>';

 h+='<p class="note" style="margin-top:8px">图例：'+CARDS.map((c,i)=>'<span class="b '+ci(i)+'">'+c.no.split('-')[1]+' = '+c.n+'</span>').join(' ')+'</p></div>';
 const mo=MONTHS.map(m=>'<option>'+m+'</option>').join('');
 h+='<div class="card"><h3>调整挂靠</h3><div class="form"><select id="sp">'+PEOPLE.map(p=>'<option value="'+p.id+'">'+p.n+'</option>').join('')+'<option value="*">全部红格人员</option></select> 从 <select id="sf">'+mo+'</select> 到 <select id="st">'+MONTHS.map((m,i)=>'<option'+(i===MONTHS.length-1?' selected':'')+'>'+m+'</option>').join('')+'</select> 改挂 '+cardSel('sc','')+' <button'+dis(lead())+' onclick="sMove()">改挂</button></div><p class="note" style="margin-top:8px">由负责人决定。改挂时检查目标卡的科目、可用额度和有效期。</p></div>';
 h+='<div class="card"><h3>检查</h3><ul class="chk"><li>'+B(g.length?g.length+' 个人月':'无',g.length?'bad':'ok')+' 挂在已回收、已结题或未下达的卡上'+(g.length?'，合计 '+fmt(sum(g.map(x=>ASG[x.p.id][x.m].amt))):'')+'</li>';
 CARDS.forEach(c=>{['labor','wage'].forEach(s=>{if(!tpl(c.id).subs.includes(s))return;const x=cell(c.id,s);if(x.avail<0)h+='<li>'+B('超预算','bad')+' '+c.no+' '+SUBJ[s]+' 已排人员费超出现行预算 '+fmt(-x.avail)+'</li>'})});
 const st=PEOPLE.filter(p=>p.k==='学生三兼费'&&p.m>3000);h+='<li>'+B(st.length?st.length+' 人':'合规',st.length?'bad':'ok')+' 学生三兼费每人每月不超过 ¥3,000</li><li>'+B('提示','pri')+' 每月 23 日后财务不再受理劳务发放；当月不能发当月</li></ul></div>';
 const pm=S.pm;h+='<div class="card"><h3>发放表</h3><div class="form">月份 <select onchange="S.pm=this.value;render()">'+MONTHS.map(m=>'<option'+(m===pm?' selected':'')+'>'+m+'</option>').join('')+'</select><span class="note">由排布生成，按学校的提单方式分表：发放类型 × 经费卡。垫付款不进发放表，走支出申请。</span></div><table style="margin-top:10px"><tr><th>发放类型</th><th>经费卡</th><th>科目</th><th class="r">人数</th><th class="r">合计</th><th>能否提单</th></tr>';
 const grp={};PEOPLE.forEach(p=>{const a=ASG[p.id][pm];if(!a.amt)return;const k=p.k+'|'+a.c+'|'+p.s;(grp[k]=grp[k]||[]).push(a.amt)});
 Object.keys(grp).forEach(k=>{const [kk,c,s]=k.split('|');const w=gapWhy(c,payDate(pm));const has=tpl(c).subs.includes(s);h+='<tr><td>'+kk+'</td><td>'+card(c).no+' '+card(c).n+'</td><td>'+SUBJ[s]+'</td><td class="r">'+grp[k].length+'</td><td class="r">'+fmt(sum(grp[k]))+'</td><td>'+(w?B('不能：'+w,'bad'):!has?B('不能：该卡无此科目','bad'):B('可以','ok'))+'</td></tr>'});
 return h+'</table></div>'},

school(){const L=REQ.filter(r=>['学校审核中','被退回'].includes(r.st));
 let h='<div class="card"><h3>在学校侧的单据</h3><table><tr><th>单号</th><th>经费卡</th><th>事项</th><th class="r">金额</th><th>状态</th><th>记录</th></tr>'+(L.map(r=>'<tr><td>'+r.id+'</td><td>'+card(r.c).no+'</td><td>'+esc(r.d)+'</td><td class="r">'+fmt(r.amt)+'</td><td>'+stB(r.st)+'</td><td class="w note">'+(r.log.map(l=>esc(l[0]+' '+l[1])).join('；')||'已提交，等待财务处理')+'</td></tr>').join('')||'<tr><td colspan="6" class="note">没有在途单据</td></tr>')+'</table></div>';
 h+='<div class="card"><h3>到账认领与借票核销</h3><p class="hint">项目经费到校后要在科研系统认领才能使用；预借发票要在款到后核销。</p><table><tr><th>日期</th><th>经费卡</th><th>类型</th><th class="r">金额</th><th>待办</th><th></th></tr>'+EVENTS.map(e=>'<tr><td>'+e.d+'</td><td>'+card(e.c).no+' '+card(e.c).n+'</td><td>'+e.t+'</td><td class="r">'+fmt(e.amt)+'</td><td>'+(e.done?B('已办','ok'):B(e.todo,'warn'))+'</td><td>'+(e.done?'':'<button class="sm"'+dis(fin())+' onclick="eDone(\''+e.id+'\')">标记已办</button>')+'</td></tr>').join('')+'</table></div>';
 const back=[];REQ.forEach(r=>r.log.forEach(l=>{if(/退回|废标|流标/.test(l[1]))back.push([l[0],r.id,card(r.c).no,r.t,l[1]])}));
 h+='<div class="card"><h3>退单与废标记录</h3><table><tr><th>日期</th><th>单号</th><th>经费卡</th><th>类型</th><th>原因</th></tr>'+(back.sort().reverse().map(b=>'<tr><td>'+b[0]+'</td><td>'+b[1]+'</td><td>'+b[2]+'</td><td>'+b[3]+'</td><td class="w">'+esc(b[4])+'</td></tr>').join('')||'<tr><td colspan="5" class="note">无</td></tr>')+'</table></div>';
 return h},

settle(){let h='<div class="card"><h3>按经费卡结清</h3><p class="hint">每张卡在自己的回收或结题节点结清，不按自然年统一关账。结清条件：已到结清日；没有未结承诺；没有在途预算变更。</p><div class="scroll"><table><tr><th>经费卡</th><th>结清节点</th><th class="r">现行预算</th><th class="r">决算数</th><th>执行率</th><th class="r">未结承诺</th><th class="r">结余</th><th>结余去向</th><th></th></tr>';
 const R={cur:0,actual:0,commit:0,recall:0,keep:0,ret:0};
 CARDS.forEach(c=>{const a=agg(c.id),bal=a.cur-a.actual;const due=c.settle&&S.today>=c.settle;const openN=REQ.filter(r=>r.c===c.id&&(OPEN.includes(r.st)||r.st==='待审批')).length,adjN=ADJ.filter(x=>x.c===c.id&&['待负责人确认','已报发规办'].includes(x.st)).length;
  const where=c.end==='recall'?'学校回收':c.end==='return'?'到期上缴':'结转下年';R.cur+=a.cur;R.actual+=a.actual;R.commit+=a.commit;if(c.settle){if(c.end==='recall')R.recall+=bal;else R.keep+=bal}else R.keep+=bal;
  h+='<tr><td><b>'+c.no+'</b> '+c.n+'</td><td>'+(c.settle||'跨年，本年度只做小结')+'</td><td class="r">'+fmt(a.cur)+'</td><td class="r">'+fmt(a.actual)+'</td><td>'+pct(a.actual,a.cur)+'</td><td class="r">'+fmt(a.commit)+'</td><td class="r">'+fmt(bal)+'</td><td>'+where+'</td><td>'+(SETTLED[c.id]?B('已结清 '+SETTLED[c.id],'ok'):!c.settle?'':!due?'<span class="note">未到结清日</span>':openN||adjN?B('还有 '+(openN+adjN)+' 笔未结','warn'):'<button class="sm"'+dis(lead())+' onclick="zSettle(\''+c.id+'\')">确认结清</button>')+'</td></tr>'});
 h+='<tr class="sum"><td colspan="2">中心年度汇总</td><td class="r">'+fmt(R.cur)+'</td><td class="r">'+fmt(R.actual)+'</td><td>'+pct(R.actual,R.cur)+'</td><td class="r">'+fmt(R.commit)+'</td><td class="r">'+fmt(R.cur-R.actual)+'</td><td colspan="2">回收 '+fmt(R.recall)+'　结转或留用 '+fmt(R.keep)+'</td></tr></table></div></div>';
 const bySub={};CARDS.forEach(c=>tpl(c.id).subs.forEach(s=>{const x=cell(c.id,s);bySub[s]=bySub[s]||{cur:0,actual:0};bySub[s].cur+=x.cur;bySub[s].actual+=x.actual}));
 h+='<div class="card"><h3>年度汇总：按科目</h3><p class="hint">各卡科目模板不同，汇总时按科目名归并。</p><table><tr><th>科目</th><th class="r">现行预算</th><th class="r">决算数</th><th>执行率</th></tr>'+Object.keys(bySub).map(s=>'<tr><td>'+SUBJ[s]+'</td><td class="r">'+fmt(bySub[s].cur)+'</td><td class="r">'+fmt(bySub[s].actual)+'</td><td>'+pct(bySub[s].actual,bySub[s].cur)+'</td></tr>').join('')+'</table></div>';
 return h}
};

// ---------- 动作 ----------
const $=id=>document.getElementById(id);let seq=20;
function jNew(){const f=$('jf').value,t=$('jt').value,m=+$('jm').value,w=$('jw').value.trim(),c=S.card;if(f===t||!(m>0)||!w)return say('请选不同科目并填写金额和理由',1);if(m>cell(c,f).avail)return say('调出科目可用额度不足：'+SUBJ[f]+' 可用 '+fmt(cell(c,f).avail),1);const bad=capIssues(c,{[f]:-m,[t]:m}).find(k=>k.bad);if(bad)return say('变更后违反模板规则：'+bad.n,1);ADJ.push({id:'J'+(++seq),c,from:f,to:t,amt:m,why:w,st:'待负责人确认'});say('已发起变更，等待负责人确认')}
function jStep(id){const x=ADJ.find(a=>a.id===id);if(x.st==='待负责人确认'){x.st='已报发规办';return say(id+' 已报发规办，等待批复')}if(x.amt>cell(x.c,x.from).avail)return say('调出科目可用额度已不足，无法生效',1);x.st='已批复';x.date=S.today;say(id+' 已批复，现行预算已更新')}
function jNo(id){ADJ.find(a=>a.id===id).st='已驳回';say(id+' 已驳回')}
function rAdd(){const w=$('rw').value.trim(),v=$('rv').value,n=$('rn').value.trim();if(!w)return say('请填写答复人',1);const r=RULES[S.rk]=RULES[S.rk]||{v:'未确认',log:[]};const last=r.log.length?r.log[r.log.length-1][2]:null;r.log.push([S.today,w,v,n]);const neg=x=>x==='不可';r.v=(last&&neg(last)!==neg(v))?'争议':v;say('已记录。当前结论：'+r.v)}
function xNew(){const c=S.card,t=$('xt').value,s=$('xs').value,m=+$('xm').value,d=$('xd').value.trim(),e=$('xe').value,p=$('xp').value,g=$('xg').checked,k=card(c),r=rule(c,t);
 if(!(m>0)||!d||!e)return say('请填写金额、事项和预计入账日期',1);if(SETTLED[c])return say(k.no+' 已结清，不能再列支',1);
 if(r.v==='不可')return say('拦截：'+k.no+' 不能列支「'+t+'」。'+(r.log.length?r.log[r.log.length-1][1]+'：'+r.log[r.log.length-1][3]:''),1);
 if(r.v==='未确认')return say('拦截：'+k.no+' 能否列支「'+t+'」还没有答复，请先问财务并记录到规则表',1);
 if(S.today<k.start)return say('拦截：'+k.no+' 尚未下达',1);if(e>k.cutoff)return say('拦截：预计入账 '+e+' 晚于该卡单据截止 '+k.cutoff,1);
 const av=cell(c,s).avail;if(m>av)return say('拦截：'+SUBJ[s]+' 可用 '+fmt(av)+'，不足 '+fmt(m)+'。请先做预算变更或改走其他卡',1);
 if(t==='电脑'&&p!=='集采')return say('拦截：电脑属于集采目录，必须选集采路径',1);if(p==='直采'&&m>50000)return say('拦截：直采单件上限 5 万，请走分散采购',1);
 if(g){if(m>EMG.cap)return say('拦截：紧急通道单笔上限 '+fmt(EMG.cap),1);if(emgUsed()+m>EMG.year)return say('拦截：紧急通道全年额度已用完',1)}
 const x={id:'R'+(++seq),c,s,t,d,amt:m,st:g?'已承诺':'待审批',eta:e,log:[],emg:g};if(p){x.path=p;x.stage=0}REQ.push(x);
 say(x.id+(g?' 已走紧急通道直接占用预算，需事后补批':' 已提交，等待负责人审批')+(r.v==='争议'?'。注意：这类支出在该卡的口径有争议，有退单风险':'')+(lateWhy(x)?'。注意：'+lateWhy(x):''))}
function xOk(id){const x=REQ.find(r=>r.id===id);const av=cell(x.c,x.s).avail;if(x.amt>av)return say('无法批准：'+SUBJ[x.s]+' 可用 '+fmt(av)+'，不足 '+fmt(x.amt),1);x.st='已承诺';say(id+' 已批准，占用预算 '+fmt(x.amt))}
function xSet(id,s){REQ.find(r=>r.id===id).st=s;say(id+' '+s)}
function xPost(id){const x=REQ.find(r=>r.id===id);const v=prompt('学校入账金额',x.amt);if(v===null)return;const m=+v;if(!(m>0))return say('金额无效',1);x.st='已入账';x.post=[S.today,m];say(id+' 已入账 '+fmt(m)+(m<x.amt?'，差额 '+fmt(x.amt-m)+' 回到可用额度':''))}
function xBack(id){const x=REQ.find(r=>r.id===id);const why=prompt('退回原因','');if(!why)return;x.st='被退回';x.log.push([S.today,'退回：'+why]);const r=RULES[x.c+'|'+x.t]=RULES[x.c+'|'+x.t]||{v:'未确认',log:[]};const last=r.log.length?r.log[r.log.length-1][2]:null;r.log.push([S.today,'学校退单','不可',why]);r.v=last&&last!=='不可'?'争议':'不可';say(id+' 已记录退回，原因已写入规则表')}
function xMove(id){const x=REQ.find(r=>r.id===id);const ok=CARDS.filter(k=>k.id!==x.c&&rule(k.id,x.t).v==='可'&&!SETTLED[k.id]);const hit=ok.map(k=>{const s=tpl(k.id).subs.includes(x.s)?x.s:tpl(k.id).subs.includes('biz')?'biz':null;return s&&cell(k.id,s).avail>=x.amt&&x.eta<=k.cutoff?[k,s]:null}).find(Boolean);if(!hit)return say('没有找到规则允许且额度足够的其他卡',1);x.log.push([S.today,'由 '+card(x.c).no+' 改走 '+hit[0].no]);x.c=hit[0].id;x.s=hit[1];x.st='已承诺';say(id+' 已改走 '+hit[0].no+' '+hit[0].n+'（'+SUBJ[hit[1]]+'）')}
function pNext(id){const x=REQ.find(r=>r.id===id);x.stage++;say(id+(x.stage>=PATHS[x.path].length?' 已验收贴码，可以提交学校':' 进入「'+PATHS[x.path][x.stage]+'」'))}
function pFail(id){const x=REQ.find(r=>r.id===id);const why=prompt('废标或流标原因','');if(!why)return;const i=PATHS[x.path].indexOf('挂网竞价');x.stage=i<0?0:i;const d=new Date(x.eta);d.setDate(d.getDate()+30);x.eta=d.toISOString().slice(0,10);x.log.push([S.today,'废标或流标：'+why+'，预计入账顺延 30 天']);say(id+' 已记录，预计入账顺延到 '+x.eta+(lateWhy(x)?'。'+lateWhy(x):''),!!lateWhy(x))}
function pEta(id,v){if(v){REQ.find(r=>r.id===id).eta=v;render()}}
function sMove(){const p=$('sp').value,f=$('sf').value,t=$('st').value,c=$('sc').value;if(f>t)return say('起止月份顺序不对',1);let n=0,skip=0;const ms=MONTHS.filter(m=>m>=f&&m<=t);
 PEOPLE.forEach(pp=>{if(p!=='*'&&pp.id!==p)return;ms.forEach(m=>{const a=ASG[pp.id][m];if(!a.amt||a.c===c)return;if(p==='*'&&!gapWhy(a.c,payDate(m)))return;if(!tpl(c).subs.includes(pp.s)||gapWhy(c,payDate(m))){skip++;return}a.c=c;n++})});
 const over=['labor','wage'].filter(s=>tpl(c).subs.includes(s)&&cell(c,s).avail<0).map(s=>SUBJ[s]);say('已改挂 '+n+' 个人月到 '+card(c).no+(skip?'，'+skip+' 个人月因目标卡无对应科目或不在有效期而跳过':'')+(over.length?'。注意：'+over.join('、')+' 已超出该卡现行预算，需要预算变更':''),over.length>0)}
function eDone(id){EVENTS.find(e=>e.id===id).done=true;say('已标记')}
function zSettle(id){SETTLED[id]=S.today;const a=agg(id);say(card(id).no+' 已结清：决算数 '+fmt(a.actual)+'，执行率 '+pct(a.actual,a.cur)+'，结余 '+fmt(a.cur-a.actual)+(card(id).end==='recall'?' 由学校回收':' 结转'))}
render();
</script>
